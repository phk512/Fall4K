    // === 预览 ===
    document.getElementById('btn-preview').addEventListener('click', openPreview);
    document.getElementById('btn-pv-close').addEventListener('click', closePreview);
    document.getElementById('btn-pv-play').addEventListener('click', togglePreviewPlay);
    document.getElementById('btn-pv-stop').addEventListener('click', stopPreview);

    function openPreview() {
        if (!audioEl || !audioEl.src) {
            alert('请先导入音频文件');
            return;
        }
        previewActive = true;
        previewPaused = true;
        document.getElementById('preview-overlay').classList.add('show');
        document.getElementById('btn-pv-play').textContent = '▶ 播放';
        audioEl.pause();
        audioEl.currentTime = 0;
        previewStartTime = 0;
        drawPreview();
    }

    function closePreview() {
        previewActive = false;
        if (previewAnimId) cancelAnimationFrame(previewAnimId);
        previewAnimId = null;
        audioEl.pause();
        document.getElementById('preview-overlay').classList.remove('show');
        document.getElementById('btn-play').textContent = '▶ 播放';
        isPlaying = false;
        requestDraw();
    }

    function togglePreviewPlay() {
        if (!previewActive) return;
        if (previewPaused) {
            previewPaused = false;
            audioEl.currentTime = previewStartTime;
            audioEl.play().catch(() => {});
            document.getElementById('btn-pv-play').textContent = '⏸ 暂停';
            previewLoop();
        } else {
            previewPaused = true;
            audioEl.pause();
            previewStartTime = audioEl.currentTime;
            document.getElementById('btn-pv-play').textContent = '▶ 播放';
        }
    }

    function stopPreview() {
        previewPaused = true;
        audioEl.pause();
        audioEl.currentTime = 0;
        previewStartTime = 0;
        document.getElementById('btn-pv-play').textContent = '▶ 播放';
        drawPreview();
    }

    function previewLoop() {
        if (!previewActive || previewPaused) { previewAnimId = null; return; }
        drawPreview();
        if (audioEl.ended) {
            previewPaused = true;
            document.getElementById('btn-pv-play').textContent = '▶ 播放';
            previewAnimId = null;
            return;
        }
        previewAnimId = requestAnimationFrame(previewLoop);
    }

    function drawPreview() {
        const pw = previewCanvas.width;
        const ph = previewCanvas.height;
        pvCtx.clearRect(0, 0, pw, ph);
        pvCtx.fillStyle = '#060a12';
        pvCtx.fillRect(0, 0, pw, ph);

        const laneW = (pw - 40) / 4;
        const hitLineY = ph - 60;
        const fallSpeed = chart.scrollSpeed * 60 * 8;

        for (let i = 0; i < 4; i++) {
            const x = 20 + i * laneW;
            pvCtx.fillStyle = (i % 2 === 0) ? '#0d131f' : '#0b1019';
            pvCtx.fillRect(x, 0, laneW, ph);
        }
        for (let i = 0; i <= 4; i++) {
            const x = 20 + i * laneW;
            pvCtx.strokeStyle = '#1e2d40';
            pvCtx.lineWidth = i === 0 || i === 4 ? 1.5 : 0.7;
            pvCtx.beginPath();
            pvCtx.moveTo(x, 0);
            pvCtx.lineTo(x, ph);
            pvCtx.stroke();
        }
        pvCtx.strokeStyle = '#e94560';
        pvCtx.lineWidth = 2.5;
        pvCtx.shadowColor = 'rgba(233,68,96,0.5)';
        pvCtx.shadowBlur = 10;
        pvCtx.beginPath();
        pvCtx.moveTo(20, hitLineY);
        pvCtx.lineTo(pw - 20, hitLineY);
        pvCtx.stroke();
        pvCtx.shadowBlur = 0;
        pvCtx.fillStyle = '#e94560';
        pvCtx.font = 'bold 11px "Segoe UI","Microsoft YaHei",sans-serif';
        pvCtx.textAlign = 'right';
        pvCtx.fillText('JUDGE', pw - 22, hitLineY - 7);

        let currentTimeSec = previewPaused ? previewStartTime : (audioEl ? audioEl.currentTime : 0);
        const currentTimeMs = currentTimeSec * 1000;
        document.getElementById('preview-time').textContent =
            Math.floor(currentTimeSec / 60) + ':' + String(Math.floor(currentTimeSec % 60)).padStart(2, '0') + '.' +
            String(Math.floor((currentTimeSec % 1) * 1000)).padStart(3, '0');

        for (const note of chart.notes) {
            const noteTimeMs = beatToMs(note.beat);
            const timeDiff = noteTimeMs - currentTimeMs;
            const noteY = hitLineY - timeDiff / 1000 * fallSpeed;
            if (noteY < -80 || noteY > ph + 80) continue;
            const cx = 20 + (note.lane - 1) * laneW + laneW / 2;
            const color = LANE_COLORS[note.lane - 1];
            if (note.type === 'tap') {
                pvCtx.fillStyle = color;
                pvCtx.shadowColor = color;
                pvCtx.shadowBlur = 10;
                pvCtx.beginPath();
                pvCtx.moveTo(cx, noteY - 11);
                pvCtx.lineTo(cx + 9, noteY);
                pvCtx.lineTo(cx, noteY + 11);
                pvCtx.lineTo(cx - 9, noteY);
                pvCtx.closePath();
                pvCtx.fill();
                pvCtx.shadowBlur = 0;
            } else if (note.type === 'hold') {
                const endTimeMs = beatToMs(note.beat + note.duration);
                const endTimeDiff = endTimeMs - currentTimeMs;
                const endY = hitLineY - endTimeDiff / 1000 * fallSpeed;
                const hh = Math.max(2, noteY - endY);
                pvCtx.fillStyle = LANE_COLORS_DIM[note.lane - 1];
                pvCtx.fillRect(cx - 9, endY, 18, hh);
                pvCtx.strokeStyle = color;
                pvCtx.lineWidth = 2;
                pvCtx.strokeRect(cx - 9, endY, 18, hh);
                pvCtx.fillStyle = color;
                pvCtx.shadowColor = color;
                pvCtx.shadowBlur = 8;
                pvCtx.fillRect(cx - 11, noteY - 7, 22, 15);
                pvCtx.shadowBlur = 0;
                pvCtx.fillStyle = color;
                pvCtx.fillRect(cx - 9, endY - 4, 18, 8);
            }
        }
        for (const eff of chart.effects) {
            const effStartMs = beatToMs(eff.beat);
            let effEndMs;
            if (eff.type === 'x' || eff.type === 'y') {
                effEndMs = beatToMs(eff.beat + eff.duration);
            } else {
                effEndMs = beatToMs(eff.endBeat);
            }
            if (currentTimeMs >= effStartMs && currentTimeMs <= effEndMs) {
                const color = EFFECT_COLORS[eff.type] || '#888';
                pvCtx.fillStyle = color;
                pvCtx.globalAlpha = 0.18;
                pvCtx.fillRect(0, 0, pw, ph);
                pvCtx.globalAlpha = 1;
                pvCtx.fillStyle = color;
                pvCtx.font = 'bold 18px "Segoe UI","Microsoft YaHei",sans-serif';
                pvCtx.textAlign = 'center';
                pvCtx.shadowColor = color;
                pvCtx.shadowBlur = 14;
                pvCtx.fillText(eff.type.toUpperCase(), pw / 2, 32);
                pvCtx.shadowBlur = 0;
            }
        }
    }

    // === 导出TXT ===
    function exportChart() {
        if (!chart.audioFileName) {
            const name = prompt('请输入音频文件名（含扩展名）:');
            if (!name) return;
            chart.audioFileName = name;
        }
        const lines = [];
        lines.push('AUDIO ' + chart.audioFileName);
        const totalMs = beatToMs(chart.totalBeats);
        lines.push('TIME ' + msToTimeFormat(totalMs));
        lines.push('SPEED ' + chart.scrollSpeed.toFixed(2));
        const events = [];
        for (const note of chart.notes) {
            const ms = beatToMs(note.beat);
            if (note.type === 'tap') {
                events.push({ time: ms, line: msToTimeFormat(ms) + ' ' + note.lane + ' tap 0' });
            } else if (note.type === 'hold') {
                const durMs = beatDurationToMs(note.beat, note.beat + note.duration);
                events.push({ time: ms, line: msToTimeFormat(ms) + ' ' + note.lane + ' hold ' + durMs });
            }
        }
        for (const eff of chart.effects) {
            const ms = beatToMs(eff.beat);
            if (eff.type === 'boom' || eff.type === 'rain' || eff.type === 'flash') {
                const endMs = beatToMs(eff.endBeat);
                events.push({ time: ms, line: msToTimeFormat(ms) + ' ' + eff.type + ' ' + msToTimeFormat(endMs) });
            } else if (eff.type === 'x' || eff.type === 'y') {
                const durMs = beatDurationToMs(eff.beat, eff.beat + eff.duration);
                events.push({ time: ms, line: msToTimeFormat(ms) + ' ' + eff.type + ' ' + eff.distance + ' ' +
                    durMs });
            }
        }
        events.sort((a, b) => a.time - b.time);
        for (const ev of events) lines.push(ev.line);
        lines.push('');
        const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const baseName = chart.audioFileName.replace(/\.[^.]+$/, '');
        a.download = baseName + '_chart.txt';
        a.click();
        URL.revokeObjectURL(url);
    }
    document.getElementById('btn-export').addEventListener('click', exportChart);

    // === 全局快捷键 ===
    window.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
        if (e.ctrlKey && e.code === 'KeyZ') { e.preventDefault();
            undo(); return; }
        if (e.ctrlKey && e.code === 'KeyC') { e.preventDefault();
            copySelection(); return; }
        if (e.ctrlKey && e.code === 'KeyX') { e.preventDefault();
            cutSelection(); return; }
        if (e.ctrlKey && e.code === 'KeyV') {
            e.preventDefault();
            let targetBeat;
            if (audioEl && audioEl.duration) {
                targetBeat = msToBeat(audioEl.currentTime * 1000);
            } else {
                targetBeat = scrollOffset + editorWrap.clientHeight / pxPerBeat * 0.5;
            }
            pasteSelection(snapBeat(targetBeat, snapDiv));
            return;
        }
        if (e.ctrlKey && e.code === 'KeyA') { e.preventDefault();
            selectAllNotes(); return; }
        if (e.ctrlKey && e.code === 'KeyS') { e.preventDefault();
            saveF4K(); return; }
        if (e.ctrlKey && e.code === 'KeyO') { e.preventDefault();
            openF4K(); return; }
        if (e.ctrlKey && e.code === 'KeyN') { e.preventDefault();
            newChart(); return; }
        if (e.code === 'Delete' || e.code === 'Backspace') {
            if (selectedNotes.size > 0) { e.preventDefault();
                deleteSelection(); }
            return;
        }
        if (e.code === 'Space') {
            e.preventDefault();
            if (previewActive) { togglePreviewPlay(); } else { document.getElementById('btn-play').click(); }
        }
        if (e.code === 'Escape') {
            if (previewActive) { closePreview(); } else if (selectedNotes.size > 0) { clearSelection(); } else { fileDropdown
                    .classList.remove('show'); }
        }
        if (e.code === 'Digit1') { currentTool = 'tap';
            setActiveToolButton(document.getElementById('btn-tool-tap')); }
        if (e.code === 'Digit2') { currentTool = 'sel';
            setActiveToolButton(document.getElementById('btn-tool-sel')); }
        if (e.code === 'Digit3') { currentTool = 'del';
            setActiveToolButton(document.getElementById('btn-tool-del')); }
    });

    // === 窗口大小变化 ===
    window.addEventListener('resize', function() {
        resizeCanvas();
        requestDraw();
    });

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const w = editorWrap.clientWidth;
        const h = editorWrap.clientHeight;
        editorCanvas.style.width = w + 'px';
        editorCanvas.style.height = h + 'px';
        editorCanvas.width = w * dpr;
        editorCanvas.height = h * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }

    // === 加载背景PNG ===
    function loadBackgroundImage() {
        bgImage = new Image();
        bgImage.onload = function() {
            requestDraw();
        };
        bgImage.onerror = function() {
            bgImage = null;
        };
        bgImage.src = BG_IMAGE_PATH;
    }

    // === 初始设置 ===
    resizeCanvas();
    loadBackgroundImage();
    chart.delay = parseInt(document.getElementById('inp-delay').value) || 0;
    chart.initialBPM = parseFloat(document.getElementById('inp-bpm').value) || 120;
    chart.scrollSpeed = parseFloat(document.getElementById('inp-speed').value) || 0.06;
    document.getElementById('sel-effect-type').dispatchEvent(new Event('change'));
    renderBPMList();
    renderEffectList();
    drawEditor();
})();
